# ANCIEN format Smithery (build stdio depuis le dépôt). Smithery publie aujourd'hui par URL : voir SMITHERY_A_VALIDER.md.
# Gardé seulement pour remplacer l'ancien smithery.yaml du dépôt (qui pointe vers l'API à 29 outils).
startCommand:
  type: stdio
  configSchema:
    type: object
    properties: {}
  commandFunction: |-
    (config) => ({ command: "python3", args: ["server.py"], env: { LEGION_TLOG_BASE: "https://tlog.legion-api.com/tlog/v0" } })
