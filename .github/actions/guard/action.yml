name: 'Legion Guard'
description: 'Fail the job if an AI provider you depend on had a critical incident or substantive ToS change since a given time. Free, no key.'
branding: { icon: 'shield', color: 'green' }
inputs:
  providers: { description: 'openai,anthropic,google,mistral,groq', required: true }
  since: { description: 'ISO timestamp; default 24h ago', required: false, default: '' }
  fail_on: { description: 'HOLD, REVIEW or never', required: false, default: 'HOLD' }
outputs:
  verdict: { description: 'PROCEED / REVIEW / HOLD / UNKNOWN', value: ${{ steps.g.outputs.verdict }} }
runs:
  using: composite
  steps:
    - id: g
      shell: bash
      run: |
        R=$(curl -sf --max-time 20 "https://api.legion-api.com/guard?providers=${{ inputs.providers }}&since=${{ inputs.since }}") || { echo "verdict=UNKNOWN" >> $GITHUB_OUTPUT; echo "::warning::Legion Guard unreachable"; exit 0; }
        V=$(echo "$R" | python3 -c "import json,sys;print(json.load(sys.stdin)['verdict'])"); echo "verdict=$V" >> $GITHUB_OUTPUT
        echo "$R" | python3 -c "import json,sys;[print(f\"::notice::{p}: {v['verdict']} — {v.get('critical_incidents',0)} critical, {v.get('tos_changed',0)} ToS\") for p,v in json.load(sys.stdin)['providers'].items()]"
        case "${{ inputs.fail_on }}:$V" in HOLD:HOLD|REVIEW:HOLD|REVIEW:REVIEW) echo "::error::Legion Guard: $V — a dependency changed"; exit 1;; esac
